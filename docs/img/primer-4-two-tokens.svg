<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Left: an AI token is a piece of text, shown as the word literal split into pieces. Right: a design token is a named value, shown as a button token pointing to a colour token pointing to a hex value, with the hook rejecting the raw hex" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif">
  <rect width="640" height="230" rx="12" fill="#F5F4EE"/>
  <line x1="300" y1="20" x2="300" y2="210" stroke="#C9C6B8"/>

  <text x="16" y="34" font-size="15" fill="#545D57" font-weight="600">AI token: a piece of text</text>
  <g font-size="17" fill="#14201A">
    <rect x="16" y="56" width="62" height="38" rx="8" fill="#FFFFFF" stroke="#C9C6B8"/>
    <text x="47" y="81" text-anchor="middle">liter</text>
    <rect x="86" y="56" width="44" height="38" rx="8" fill="#FFFFFF" stroke="#C9C6B8"/>
    <text x="108" y="81" text-anchor="middle">al</text>
    <rect x="138" y="56" width="76" height="38" rx="8" fill="#FFFFFF" stroke="#C9C6B8"/>
    <text x="176" y="81" text-anchor="middle">values</text>
    <rect x="222" y="56" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#C9C6B8"/>
    <text x="241" y="81" text-anchor="middle">.</text>
  </g>
  <text x="16" y="128" font-size="14" fill="#545D57">About three quarters of a word in English.</text>
  <text x="16" y="148" font-size="14" fill="#545D57">The unit the model writes in and</text>
  <text x="16" y="168" font-size="14" fill="#545D57">the unit the context window is measured in.</text>

  <text x="324" y="34" font-size="15" fill="#1F6F4A" font-weight="600">Design token: a named value</text>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#14201A">
    <rect x="324" y="50" width="196" height="30" rx="6" fill="#FFFFFF" stroke="#C9C6B8"/>
    <text x="334" y="70">--button-primary-bg</text>
    <rect x="324" y="98" width="196" height="30" rx="6" fill="#FFFFFF" stroke="#C9C6B8"/>
    <text x="334" y="118">--color-primary-600</text>
    <rect x="324" y="146" width="196" height="30" rx="6" fill="#FFFFFF" stroke="#C9C6B8"/>
    <text x="334" y="166">#85573a</text>
    <rect x="490" y="152" width="18" height="18" rx="4" fill="#85573a"/>
  </g>
  <line x1="422" y1="80" x2="422" y2="96" stroke="#14201A" stroke-width="1.5"/>
  <polygon points="416,94 428,94 422,102" fill="#14201A"/>
  <line x1="422" y1="128" x2="422" y2="144" stroke="#14201A" stroke-width="1.5"/>
  <polygon points="416,142 428,142 422,150" fill="#14201A"/>
  <text x="532" y="70" font-size="12" fill="#545D57">component</text>
  <text x="532" y="118" font-size="12" fill="#545D57">primitive</text>
  <text x="532" y="166" font-size="12" fill="#545D57">the value</text>

  <rect x="316" y="186" width="312" height="30" rx="6" fill="none" stroke="#A8261F" stroke-width="1.5"/>
  <text x="326" y="206" font-size="12.5" fill="#A8261F">Hook: a raw #85573a in a component is rejected</text>
</svg>
