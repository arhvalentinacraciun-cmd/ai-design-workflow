<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="The agent loop: your request goes to the model, which decides, uses a tool, gets the result back into the window and decides again until it answers you; memory files are read at the start and a skill is loaded when you type its name or when your request matches it" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="sh3" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#14201A" flood-opacity="0.14"/></filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14201A"/></marker>
    <marker id="arr3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6F4A"/></marker>
  </defs>
  <rect width="640" height="300" rx="12" fill="#F5F4EE"/>

  <!-- loaded into the window -->
  <g filter="url(#sh3)">
    <rect x="16" y="18" width="250" height="56" rx="10" fill="#DCEBE2" stroke="#1F6F4A"/>
    <rect x="282" y="18" width="300" height="56" rx="10" fill="#DCEBE2" stroke="#1F6F4A"/>
  </g>
  <text x="30" y="41" font-size="14" fill="#14201A" font-weight="600">Memory and AGENTS.md</text>
  <text x="30" y="61" font-size="12.5" fill="#545D57">markdown files, read at the start</text>
  <text x="296" y="41" font-size="14" fill="#14201A" font-weight="600">Skill: <tspan font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">/new-ticket</tspan></text>
  <text x="296" y="61" font-size="12.5" fill="#545D57">a markdown file, loaded when you need it</text>
  <line x1="150" y1="74" x2="284" y2="118" stroke="#1F6F4A" stroke-width="1.5" marker-end="url(#arr3g)"/>
  <line x1="400" y1="74" x2="350" y2="118" stroke="#1F6F4A" stroke-width="1.5" marker-end="url(#arr3g)"/>

  <!-- main row -->
  <g filter="url(#sh3)">
    <rect x="16" y="124" width="120" height="56" rx="10" fill="#FFFFFF" stroke="#D6D4C8"/>
    <rect x="228" y="120" width="170" height="64" rx="10" fill="#1F6F4A"/>
    <rect x="452" y="124" width="172" height="56" rx="10" fill="#FFFFFF" stroke="#D6D4C8"/>
  </g>
  <text x="76" y="148" text-anchor="middle" font-size="15" fill="#14201A" font-weight="600">You</text>
  <text x="76" y="168" text-anchor="middle" font-size="13" fill="#545D57">a request</text>
  <text x="313" y="147" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="600">Model decides</text>
  <text x="313" y="167" text-anchor="middle" font-size="12.5" fill="#DCEBE2">from what is in the window</text>
  <text x="538" y="148" text-anchor="middle" font-size="15" fill="#14201A" font-weight="600">Tool</text>
  <text x="538" y="168" text-anchor="middle" font-size="12.5" fill="#545D57">read, run or edit a file</text>

  <line x1="136" y1="152" x2="226" y2="152" stroke="#14201A" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="398" y1="142" x2="450" y2="142" stroke="#14201A" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="424" y="134" text-anchor="middle" font-size="12" fill="#545D57">uses</text>

  <!-- result back -->
  <path d="M452,166 L430,166 L430,204 L350,204 L350,186" fill="none" stroke="#14201A" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="362" y="226" font-size="13" fill="#14201A">the result goes back into the window,</text>
  <text x="362" y="244" font-size="13" fill="#14201A">then it decides again</text>

  <!-- answer -->
  <line x1="270" y1="184" x2="270" y2="240" stroke="#14201A" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="262" y="216" text-anchor="end" font-size="12" fill="#545D57">when done</text>
  <g filter="url(#sh3)"><rect x="190" y="242" width="160" height="44" rx="10" fill="#FFFFFF" stroke="#D6D4C8"/></g>
  <text x="270" y="269" text-anchor="middle" font-size="15" fill="#14201A" font-weight="600">Answer to you</text>
</svg>
