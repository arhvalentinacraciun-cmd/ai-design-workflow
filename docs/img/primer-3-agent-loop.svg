<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="The agent loop: your request goes to the model, which decides, uses a tool, gets the result back into the window and decides again until it answers; a skill loads into the window, memory files are read at start, and a hook runs after the tool and can reject its edit" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif">
  <rect width="640" height="330" rx="12" fill="#F5F4EE"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14201A"/>
    </marker>
    <marker id="arr-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8261F"/>
    </marker>
  </defs>

  <!-- top: things loaded into the window -->
  <g font-size="14">
    <rect x="16" y="20" width="176" height="54" rx="8" fill="#DCEBE2" stroke="#1F6F4A"/>
    <text x="28" y="42" fill="#14201A" font-weight="600">Memory, CLAUDE.md</text>
    <text x="28" y="62" fill="#545D57">read at the start</text>

    <rect x="208" y="20" width="170" height="54" rx="8" fill="#DCEBE2" stroke="#1F6F4A"/>
    <text x="220" y="42" fill="#14201A" font-weight="600">Skill: /session-2</text>
    <text x="220" y="62" fill="#545D57">loaded when you type it</text>
  </g>
  <line x1="150" y1="74" x2="250" y2="128" stroke="#1F6F4A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="293" y1="74" x2="293" y2="128" stroke="#1F6F4A" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- main row -->
  <g font-size="15" fill="#14201A">
    <rect x="16" y="130" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#14201A"/>
    <text x="71" y="152" text-anchor="middle" font-weight="600">You</text>
    <text x="71" y="172" text-anchor="middle" fill="#545D57" font-size="13">a request</text>

    <rect x="208" y="130" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#14201A" stroke-width="2"/>
    <text x="293" y="152" text-anchor="middle" font-weight="600">Model decides</text>
    <text x="293" y="172" text-anchor="middle" fill="#545D57" font-size="13">from what is in the window</text>

    <rect x="420" y="130" width="204" height="52" rx="8" fill="#FFFFFF" stroke="#14201A"/>
    <text x="522" y="152" text-anchor="middle" font-weight="600">Tool</text>
    <text x="522" y="172" text-anchor="middle" fill="#545D57" font-size="12">read, run, or edit files</text>
  </g>
  <line x1="126" y1="156" x2="206" y2="156" stroke="#14201A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="378" y1="148" x2="418" y2="148" stroke="#14201A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="398" y="140" text-anchor="middle" font-size="12" fill="#545D57">uses</text>

  <!-- result back into the window -->
  <path d="M420,168 L400,168 L400,206 L336,206 L336,184" fill="none" stroke="#14201A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="346" y="226" font-size="13" fill="#14201A">the result goes back into the window;</text>
  <text x="346" y="244" font-size="13" fill="#14201A">then it decides again</text>

  <!-- answer -->
  <line x1="250" y1="182" x2="250" y2="246" stroke="#14201A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="242" y="218" text-anchor="end" font-size="12" fill="#545D57">when done</text>
  <rect x="170" y="248" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#14201A"/>
  <text x="250" y="275" text-anchor="middle" font-size="15" fill="#14201A" font-weight="600">Answer to you</text>

  <!-- hook -->
  <rect x="392" y="256" width="232" height="62" rx="8" fill="#FFFFFF" stroke="#A8261F" stroke-width="2"/>
  <text x="404" y="276" font-size="15" fill="#A8261F" font-weight="600">Hook</text>
  <text x="404" y="294" font-size="12" fill="#14201A">runs by itself after the edit;</text>
  <text x="404" y="310" font-size="12" fill="#14201A">can say no: "literal #85573a"</text>
  <line x1="560" y1="256" x2="560" y2="184" stroke="#A8261F" stroke-width="1.5" marker-end="url(#arr-no)"/>
</svg>
