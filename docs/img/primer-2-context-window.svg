<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-label="The context window as one box with a fixed size, filled from the top by start-up files, files read, your messages and its own answers; training knowledge sits outside the box" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif">
  <rect width="640" height="310" rx="12" fill="#F5F4EE"/>

  <text x="16" y="34" font-size="15" fill="#1F6F4A" font-weight="600">Context window: what it has in front of it right now</text>
  <rect x="16" y="46" width="400" height="248" rx="10" fill="#FFFFFF" stroke="#14201A" stroke-width="2"/>

  <g font-size="16" fill="#14201A">
    <rect x="28" y="58" width="376" height="44" rx="6" fill="#DCEBE2" stroke="#1F6F4A"/>
    <text x="40" y="78">Loaded at start: CLAUDE.md, memory index</text>
    <text x="40" y="96" font-size="13" fill="#545D57">the same every session, by design</text>

    <rect x="28" y="108" width="376" height="40" rx="6" fill="#F5F4EE" stroke="#C9C6B8"/>
    <text x="40" y="133">Files it has read this session</text>

    <rect x="28" y="154" width="376" height="40" rx="6" fill="#F5F4EE" stroke="#C9C6B8"/>
    <text x="40" y="179">Your messages</text>

    <rect x="28" y="200" width="376" height="40" rx="6" fill="#F5F4EE" stroke="#C9C6B8"/>
    <text x="40" y="225">Its own answers and tool results</text>

    <rect x="28" y="246" width="376" height="36" rx="6" fill="none" stroke="#C9C6B8" stroke-dasharray="6 4"/>
    <text x="40" y="269" fill="#545D57">free space, shrinking as the session goes on</text>
  </g>

  <text x="436" y="34" font-size="15" fill="#545D57" font-weight="600">Outside the box</text>
  <rect x="436" y="46" width="188" height="92" rx="10" fill="#ECEAE0" stroke="#C9C6B8"/>
  <text x="448" y="72" font-size="16" fill="#14201A">Training</text>
  <text x="448" y="94" font-size="14" fill="#545D57">language and general</text>
  <text x="448" y="112" font-size="14" fill="#545D57">knowledge, fixed before</text>
  <text x="448" y="130" font-size="14" fill="#545D57">you opened it</text>

  <rect x="436" y="154" width="188" height="140" rx="10" fill="none" stroke="#A8261F" stroke-width="2"/>
  <text x="448" y="180" font-size="16" fill="#A8261F" font-weight="600">When the box is full</text>
  <text x="448" y="204" font-size="14" fill="#14201A">the oldest parts are</text>
  <text x="448" y="222" font-size="14" fill="#14201A">summarised or dropped.</text>
  <text x="448" y="250" font-size="14" fill="#14201A">A session has an end.</text>
  <text x="448" y="268" font-size="14" fill="#14201A">New task, new session;</text>
  <text x="448" y="286" font-size="14" fill="#14201A">the files come back.</text>
</svg>
